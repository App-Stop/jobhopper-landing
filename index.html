<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>JobHopper — The Two-Sided Marketplace for Trades &amp; Services</title>
    <meta
      name="description"
      content="JobHopper connects you with verified local professionals who compete for your job — so you get fair prices, fast."
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Desktop is laid out at the Figma board width (1920px) and scaled
      // down proportionally so laptops see the same composition.
      ;(function () {
        var root = document.getElementById("root")
        function fit() {
          var w = document.documentElement.clientWidth
          root.style.zoom = matchMedia("(min-width: 81rem)").matches && w < 1920 ? String(w / 1920) : ""
        }
        fit()
        addEventListener("resize", fit)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
